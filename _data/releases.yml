  date: 2026-11-11
  windows: true
  summary: Bulgarian (whole app, quick add and voice), My server (your own Ollama or LM Studio over Tailscale), Mac updates inside the app, iPhone and phone export fixes.
- version: 0.3.2
  date: 2026-11-10
  windows: true
