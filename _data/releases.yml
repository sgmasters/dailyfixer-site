# Newest first. Assets live on this repo's GitHub Releases (tag v<version>), copied from the
# private app repo by its release workflow (docs/release/android.md in the app repo).
# Add an entry per release; the Download and Releases pages read this file.
# windows: true = the release also has DailyFixer-<version>-windows-x64.zip.
# files: false = notes are out but the APKs are not on this repo's Releases yet; the
# Download page then offers the newest release that has files. Remove the line once
# the release exists here.
